<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My crush</title>
</head>
<style>
             body{
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #ffd6e8, #fff0f6);
        font-family: Arial,  sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;

    }
    .card{
        background: white;
        width: 90%;
        max-width: 380px;
        padding: 35px 25px;
        border-radius: 25px;
        text-align: center;
        box-shadow: 0 10px 0px rgba(0,0,0,0.2);
    }
    .heart{
        font-size: 45px;
        animation:heartbeat 1s infinite;
    }



    h1{
        color: #ff4f9a;
        margin-bottom: 10px;
    }
    h2{
        color: #333;
        margin-top: 25px;
    }
    p{
        color: #444;
        font-size: 17px;
        line-height: 1.5;
    }
    .buttons{

        margin-top: 25px;
        height: 80px;
        position: relative;
    }
    button{
        border: none;
        padding: 13px 28px;
        border-radius: 30px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s ease;

    }

    #yesBtn{
        background: #ff4f9a;
        color: white;
        margin-left: 15px;
    }
    #yesBtn:hover{
        transform: scale(1.1);
        background: #ff2f86;
    }
#noBtn{
    background: #eeeeee;
    color: #333;
    position: absolute;
    top: 0;
}

#smallText{
    font-size: 14px;
    color: #999;
}
@keyframes heartbeat{
    0%, 100%{
        transform: scale(1);
    }

    50%{
        transform: scale(1.25);
    }

}

</style>
<body>
    <div class="card">
        <div class="heart">🖤</div>

            <h1>Hey Crush</h1>

            <p id="message">
                Since this is a website. I guess for me it was love at the first sight😝
            </p>

            <h2>Wanna hang out one more time?</h2>


            <div class="buttons">
                <button id="yesBtn">Yes😊</button>
                <button id="noBtn">No😭</button>


            <p id="smallText">Think about it Before you pick No😂</p>

            </div>
    </div>
    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const smallText = document.getElementById('smallText');

        let noCount = 0;
        function moveNoButton(){
            noCount++;

            const randomX = Math.random() * 800-400;
            const randomY = Math.random() * 800-400;

            noBtn.style.position = "fixed";
            noBtn.style.left = `$
            {randomX}px`;
            noBtn.style.top = `$
            {randomY}px`;
            
            

            if (noCount === 1) {
                smallText.textContent = "you can say No😭";
            } else if (noCount === 2){
                smallText.textContent = "If it was our Fate, you can say Yes😘";
            } else if(noCount === 3){
                smallText.textContent = "Because i can see it in your eyes, You look beautiful😍";
            }else{
                smallText.textContent ="No way, Just Pick Yes😘";
            }
        }

        noBtn.addEventListener("mouseover", moveNoButton);
        noBtn.addEventListener("touchstart", moveNoButton);

        yesBtn.addEventListener("click", () => {
            document.body.innerHTML = `
            <div class="card">
                <div class="heart">💓</div>
                <h1>Yay!😍</h1>
                <p> I Knew you liked me too!</p>
                <h2>so wonderful to hear?</h2>
                <h2>so amazing?</h2>
                <h2>💑</h2>
                <p>Finally We are Together now!</p>
                <p>And forever will Be Together🧑‍🤝‍🧑</p>
                </div>
            `;

   });
    </script>
</body>
</html>
